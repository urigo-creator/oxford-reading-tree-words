<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxford Reading Tree 단어놀이</title>
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <svg class="brand-tree" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="29" y="34" width="6" height="24" rx="2" fill="#8a5a3b"/>
      <circle cx="32" cy="26" r="20" fill="#2a9d3f"/>
      <circle cx="18" cy="34" r="13" fill="#33ac48"/>
      <circle cx="46" cy="34" r="13" fill="#33ac48"/>
      <circle cx="22" cy="20" r="5" fill="#ef476f"/>
      <circle cx="42" cy="22" r="5" fill="#ffb703"/>
      <circle cx="32" cy="36" r="5" fill="#ef476f"/>
    </svg>
    <div class="brand-text">
      <h1>Oxford Reading Tree 단어놀이</h1>
      <p>그림으로 먼저 만나는 영어 단어 &amp; 표현</p>
    </div>
  </div>
</header>

<div class="level-tabs-wrap">
  <nav id="levelTabs" aria-label="레벨 선택"></nav>
</div>

<div class="unit-tabs-wrap">
  <nav id="unitTabs" aria-label="유닛 선택"></nav>
</div>

<div class="book-tabs-wrap">
  <nav id="bookTabs" aria-label="책 선택"></nav>
</div>

<div class="sub-tabs-wrap">
  <div id="subTabs"></div>
</div>

<main>
  <div class="grid-panel">
    <div id="cardGrid"></div>
    <div id="quizArea" hidden></div>
  </div>
</main>

<footer>🌳 우리 아이 첫 영어 단어, 책 읽기 전에 그림카드로 먼저 만나요.</footer>

<!-- 학습 모달 -->
<dialog id="studyModal">
  <div class="modal-inner">
    <button class="modal-close" id="btnCloseModal" aria-label="닫기">✕</button>
    <div class="study-nav">
      <button class="nav-btn" id="btnPrevItem" aria-label="이전 단어">◀</button>
      <span class="study-counter" id="studyCounter"></span>
      <button class="nav-btn" id="btnNextItem" aria-label="다음 단어">▶</button>
    </div>
    <div id="modalImage" class="study-image"></div>
    <h2 class="study-word" id="modalWord"></h2>
    <p class="study-ko" id="modalKo"></p>

    <p class="section-title">🔊 발음 연습</p>
    <div class="btn-row">
      <button class="btn btn-pill" id="btnListenNative">🔊 원어민 발음 듣기</button>
      <button class="btn btn-pill" id="btnRecord">🎤 내 발음 녹음하기</button>
    </div>
    <audio id="recordPlayback" controls hidden></audio>
    <div class="btn-row" id="recordCompareRow" hidden style="margin-top:10px;">
      <button class="btn btn-pill" id="btnListenNative2">🔊 원어민 발음 다시 듣기</button>
    </div>
  </div>
</dialog>

<script src="js/data.js?v=5"></script>
<script src="js/app.js?v=5"></script>
</body>
</html>
